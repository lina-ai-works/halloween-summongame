<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Halloween Magical Summon</title><style>
*{box-sizing:border-box}body{margin:0;background:#080713;color:#fff;font-family:Georgia,'Yu Mincho',serif;text-align:center}button{font:inherit;cursor:pointer}.app{position:relative;width:min(100vw,520px);height:100dvh;min-height:620px;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,#392046 0%,#100d23 55%,#07060e 100%)}.heading{position:absolute;top:4%;width:100%;z-index:3;text-shadow:0 2px 10px #000;font-size:clamp(18px,5vw,27px);letter-spacing:.08em}.sub{font-size:12px;color:#efc9ff;margin-top:8px}.wizard{position:absolute;top:15%;left:9%;width:82%;height:72%;object-fit:cover;object-position:center;filter:drop-shadow(0 0 20px #e9a3ff77);border-radius:15px}.ring{position:absolute;width:min(94vw,490px);height:min(94vw,490px);max-height:60dvh;max-width:60dvh;top:51%;left:50%;transform:translate(-50%,-50%);animation:spin 90s linear infinite}.sigil{position:absolute;width:clamp(48px,13vw,66px);height:clamp(48px,13vw,66px);border:2px solid #d6adff;border-radius:50%;background:#1b103dbb;color:#f9e7ff;box-shadow:0 0 14px #9d55ff,inset 0 0 13px #8a5cc4;display:grid;place-items:center;font-size:26px;transform:translate(-50%,-50%);touch-action:manipulation;z-index:4}.sigil svg{width:78%;height:78%;fill:none;stroke:#f5d6ff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 3px #c97cff)}.sigil .sigil-outer{stroke-width:.8;opacity:.7}.sigil:before{content:'';position:absolute;inset:7px;border:1px solid #f4c8ff;border-radius:50%}.sigil:active{box-shadow:0 0 35px #fff}.hint{position:absolute;bottom:7%;width:100%;color:#e7c6ff;font-size:13px;z-index:2}@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}.overlay{position:absolute;inset:0;z-index:10;background:#070611;display:none;align-items:center;justify-content:center;flex-direction:column;padding:18px}.overlay.show{display:flex}.portrait{height:min(61dvh,620px);max-width:100%;aspect-ratio:4/5;object-fit:contain;border:1px solid #ad83ce;box-shadow:0 0 30px #8044ae77}.caption{width:100%;max-width:420px;line-height:1.8;margin:13px 0;color:#fff3ff;text-shadow:0 1px 8px #000;white-space:pre-line}.action{display:inline-block;writing-mode:horizontal-tb;white-space:normal;padding:12px 20px;margin:4px;border:1px solid #ddbbf6;border-radius:30px;background:#291739;color:white;box-shadow:0 0 12px #9c66c066}.back{background:transparent}.fade{animation:appear .6s ease}@keyframes appear{from{opacity:0;filter:brightness(3)}to{opacity:1;filter:brightness(1)}}@media(max-height:690px){.wizard{top:17%;height:69%}.portrait{height:61dvh}.heading{top:2%}.hint{bottom:2%}}

/* 召喚時の柔らかな光 */
.light-burst{position:absolute;inset:0;z-index:30;pointer-events:none;opacity:0;visibility:hidden;background:radial-gradient(circle at 50% 50%,#fff 0%,#fffdf7 18%,#ffffffdd 40%,#ffffff00 80%)}
.light-burst.pink{background:radial-gradient(circle at 50% 50%,#fff 0%,#ffe2f6 20%,#ff9bd4c9 47%,#ff9bd400 82%)}
.light-burst.active{visibility:visible;animation:burstLight .85s ease-in-out both}
@keyframes burstLight{0%{opacity:0;transform:scale(.45)}32%{opacity:.97;transform:scale(1.3)}52%{opacity:.95;transform:scale(1.6)}100%{opacity:0;transform:scale(2)}}
@media(prefers-reduced-motion:reduce){.light-burst.active{animation:burstLight .25s ease-out both}}
.overlay.transitioning > *{visibility:hidden}
</style></head><body><main class="app"><div class="heading">✦ Halloween Magical Summon ✦<div class="sub">魔法陣を選んで、彼を召喚してね</div></div><img class="wizard" src="images/wizard.png" alt="魔法使い"><div class="ring" id="ring"></div><div class="hint">✧ どの彼に出会えるかは、秘密 ✧</div><section class="overlay" id="overlay" aria-live="polite"><img class="portrait" id="portrait" alt="召喚された彼"><div class="caption" id="caption"></div><div id="actions"></div></section><div class="light-burst" id="lightBurst" aria-hidden="true"></div></main><script>
const characters=[
['vampire','ヴァンパイア','……誰の許しを得て、私を呼び出した？','覚悟しなさい。\n今夜は、君を帰すつもりはない。'],
['werewolf','狼男','……なんだよ。俺を呼び出したの、お前？','へぇ……お前、いい匂いするな。\nもう少し近くに来いよ'],
['grimreaper','死神','……君の魂を迎えに来た','……困ったな。君の魂だけは、奪いたくない'],
['mummyman','ミイラ男','……誰だ。俺の眠りを邪魔したのは','……そんなに俺の顔が見たいのか？\n特別に、お前だけに見せてやる'],
['jackolantern','ジャックオランタン','……俺の素顔が見たいの？','見ちゃったね。……もう逃がしてあげないよ？'],
['clown','ピエロ','あれ？ 僕を呼んだのは君？ ……面白い子だね','そんなに見つめないでよ。……本気になっちゃうでしょ？'],
['fallenangel','堕天使','……僕を呼んだの？ 天界を追われた、この僕を……','……君のそばにいられるなら、\nもう天国には戻れなくてもいい'],
['demon','悪魔','……俺を呼び出すとは、いい度胸だな','困ったな。\nお前のせいで、隠していた本性が出ちまった。']
];
const sigilDesigns=[`<path d="M34 13a19 19 0 1 0 17 30 21 21 0 0 1-17-30Z"/><path d="m48 15 2 5 5 2-5 2-2 5-2-5-5-2 5-2Z"/>`, `<path d="M32 12 49 42H15Z M32 52 15 22h34Z"/><path d="M10 13v7m44 24v7M8 36l5-4m38-1 5 5"/>`, `<path d="M21 17h22l10 14-21 23-21-23Z M11 31h42 M21 17l11 14 11-14M32 31v23"/>`, `<path d="M32 15c12-8 20 9 9 16-3 11-19 12-22 0-8-9 1-20 13-16Z M32 23c-10-2-10 12 0 13 12-1 9-16-1-13Z M31 41c-3 7-8 9-15 11m15-11c8 4 12 7 18 10 M19 46l-7-2m30 2 7-5"/>`, `<path d="M34 31c0-9-15-9-15 3 0 15 27 16 30-1 3-21-30-30-40-8"/><path d="m14 12 3 5-5 2m40 2-4 4 5 3M15 51l6-1-1-6"/>`, `<circle cx="32" cy="32" r="12"/><path d="M32 6v10m0 32v10M6 32h10m32 0h10M14 14l7 7m22 22 7 7M50 14l-7 7M21 43l-7 7"/><circle cx="32" cy="32" r="5"/>`, `<path d="M15 50Q18 12 52 11Q54 43 15 50Z M15 50 45 20 M26 38l-2-13m12 3 12 1"/><path d="M9 14v8m45 27v7"/>`, `<path d="M32 32C18 12 7 24 12 34c6 14 20-2 20-2s14-16 20-2c5 10-6 22-20 2Z"/><circle cx="12" cy="34" r="2"/><circle cx="52" cy="30" r="2"/><path d="m15 12 6 3 6-5m10 44 7-4 6 5"/>`];
const ring=document.getElementById('ring'),overlay=document.getElementById('overlay'),portrait=document.getElementById('portrait'),caption=document.getElementById('caption'),actions=document.getElementById('actions');let current;
characters.forEach((_,i)=>{let b=document.createElement('button');b.className='sigil';const angle=(i*45-90)*Math.PI/180;b.style.left=(50+45*Math.cos(angle))+'%';b.style.top=(50+45*Math.sin(angle))+'%';b.innerHTML='<svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="28" class="sigil-outer"/>'+sigilDesigns[i]+'</svg>';b.setAttribute('aria-label','魔法陣 '+(i+1));b.onclick=()=>summon(i);ring.appendChild(b)});
function button(label,fn,cls=''){let b=document.createElement('button');b.className='action '+cls;b.textContent=label;b.onclick=fn;actions.appendChild(b)}
const lightBurst=document.getElementById('lightBurst');let transitioning=false;let transitionToken=0;
// 画像を事前に読み込み、前の彼が表示される時間をなくす。
characters.forEach(c=>[1,2].forEach(n=>{const img=new Image();img.src='images/'+c[0]+n+'.png'}));
function loadPortrait(src){return new Promise(resolve=>{const img=new Image();img.onload=()=>resolve();img.onerror=()=>resolve();img.src=src;if(img.complete)resolve()})}
function burst(color,after){
 if(transitioning)return;
 transitioning=true;
 const token=++transitionToken;
 // 光が強くなるまで、以前の画像やセリフを見せない。
 overlay.classList.add('transitioning');
 lightBurst.className='light-burst '+(color==='pink'?'pink':'');
 void lightBurst.offsetWidth;
 lightBurst.classList.add('active');
 setTimeout(async()=>{
   if(token!==transitionToken)return;
   await after();
   if(token!==transitionToken)return;
   // 新しい画像の読み込み完了後にだけ表示。
   overlay.classList.remove('transitioning');
 },310);
 setTimeout(()=>{
   if(token!==transitionToken)return;
   lightBurst.classList.remove('active');
   transitioning=false;
   overlay.classList.remove('transitioning');
 },900);
}
async function show(n){
 const c=characters[current];
 const src='images/'+c[0]+n+'.png';
 await loadPortrait(src);
 portrait.src=src;
 portrait.classList.remove('fade');
 void portrait.offsetWidth;
 portrait.classList.add('fade');
 caption.textContent='✦ '+c[1]+' ✦\n'+(n===1?c[2]:c[3]);
 actions.replaceChildren();
 if(n===1){
  button('もっと彼に近づきたい ♡',()=>burst('pink',()=>show(2)));
  button('魔法陣に戻る',close,'back');
 }else{
  button('もう一度会う ♡',()=>burst('white',()=>show(1)));
  button('魔法陣に戻る',close,'back');
 }
}
function summon(i){
 if(transitioning)return;
 current=i;
 ring.style.animationPlayState='paused';
 overlay.classList.add('show');
 burst('white',async()=>{await show(1)});
}
function close(){
 if(transitioning)return;
 overlay.classList.remove('show');
 overlay.classList.remove('transitioning');
 portrait.removeAttribute('src');
 caption.textContent='';
 actions.replaceChildren();
 ring.style.animationPlayState='running';
}
</script></body></html>
